name: Deploy Family Graph Cloudflare App

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "admin.html"
      - "data/**"
      - "_worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Prepare Pages output
        run: |
          rm -rf cloudflare-pages-dist
          mkdir -p cloudflare-pages-dist/data
          cp index.html cloudflare-pages-dist/index.html
          cp admin.html cloudflare-pages-dist/admin.html
          cp _worker.js cloudflare-pages-dist/_worker.js
          cp data/* cloudflare-pages-dist/data/
          test -s cloudflare-pages-dist/index.html
          test -s cloudflare-pages-dist/admin.html
          test -s cloudflare-pages-dist/_worker.js
          test -s cloudflare-pages-dist/data/config.json
          test -s cloudflare-pages-dist/data/family.json

      - name: Create Pages project if needed
        run: |
          npx wrangler pages project create family-tree-community-api-shubham-2026 --production-branch main || true

      - name: Deploy Pages app
        run: |
          npx wrangler pages deploy cloudflare-pages-dist             --project-name family-tree-community-api-shubham-2026             --branch main             --config wrangler.pages.toml

      - name: Verify Pages app
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors             https://family-tree-community-api-shubham-2026.pages.dev/
          curl --fail-with-body --silent --show-error             https://family-tree-community-api-shubham-2026.pages.dev/data/config.json
          STATUS="$(curl --silent --show-error --output /tmp/admin --write-out "%{http_code}"             -X POST -H "Content-Type: application/json" --data "{}"             https://family-tree-community-api-shubham-2026.pages.dev/admin/apply)"
          test "$STATUS" = "401"
