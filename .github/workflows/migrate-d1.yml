name: Migrate Family Graph D1

on:
  push:
    branches: [main]
    paths:
      - "backend/schema.sql"
      - ".github/workflows/migrate-d1.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        working-directory: backend
        run: npm install --no-save wrangler@4
      - name: Apply production D1 schema
        working-directory: backend
        run: npx wrangler d1 execute family-tree-community-db --remote --file=./schema.sql
