name: Deploy Family Graph API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        working-directory: backend
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        working-directory: backend
        run: npx wrangler deploy
      - name: Apply D1 schema
        working-directory: backend
        run: npx wrangler d1 execute family-tree-community-db --remote --file=schema.sql
      - name: List Worker deployments
        working-directory: backend
        run: npx wrangler deployments list
      - name: Verify Worker endpoint
        run: |
          set -e
          curl --fail-with-body --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://family-tree-community.shubham-turai.workers.dev/health
          echo "CORS headers:"
          curl --silent --show-error -i https://family-tree-community.shubham-turai.workers.dev/health
          echo
          POST_STATUS="$(curl --silent --show-error --output /tmp/post-response --write-out "%{http_code}" -X POST -H "Content-Type: text/plain;charset=UTF-8" --data "{}" https://family-tree-community.shubham-turai.workers.dev/requests)"
          echo "POST status: $POST_STATUS"
          cat /tmp/post-response
          echo "Browser-origin POST:"
          curl --silent --show-error -i -X POST -H "Origin: https://shubhamturai.github.io" -H "Content-Type: text/plain;charset=UTF-8" --data "{}" https://family-tree-community.shubham-turai.workers.dev/requests
          test "$POST_STATUS" = "400"
          echo "Authenticated admin/apply dry-run:"
          ADMIN_TEST_RESPONSE="$(curl --silent --show-error --fail-with-body -X POST \\
            -H "Origin: https://shubhamturai.github.io" \\
            -H "Content-Type: application/json" \\
            -H "Authorization: Bearer $CLOUDFLARE_ADMIN_PASSWORD" \\
            --data '{"dryRun":true,"proposal":{"operation":"BATCH_UPDATE","payload":{"changes":[{"type":"UPDATE_PERSON","payload":{"personId":"P000001","displayName":"Subhash Turai"}}]}}}' \\
            https://family-tree-community.shubham-turai.workers.dev/admin/apply)"
          echo "$ADMIN_TEST_RESPONSE"
          echo "$ADMIN_TEST_RESPONSE" | grep -q '"status":"validated"'
