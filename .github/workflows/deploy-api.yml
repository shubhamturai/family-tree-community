name: Deploy Family Graph API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        working-directory: backend
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        working-directory: backend
        run: npx wrangler deploy
      - name: Apply D1 schema
        working-directory: backend
        run: npx wrangler d1 execute family-tree-community-db --remote --file=schema.sql
      - name: List Worker deployments
        working-directory: backend
        run: npx wrangler deployments list
      - name: Verify Worker endpoint
        run: |
          set -u
          for URL in \
            https://family-tree-community.shubham-turai.workers.dev/health \
            https://family-graph-request-api.shubham-turai.workers.dev/health; do
            echo "=== $URL ==="
            curl --silent --show-error --max-time 20 -i "$URL" || true
            echo
          done
          echo "Primary status:"
          curl --silent --show-error --max-time 20 --output /tmp/health-primary --write-out "%{http_code}" https://family-tree-community.shubham-turai.workers.dev/health || true
          echo
          cat /tmp/health-primary 2>/dev/null || true
          echo
          echo "=== CORS preflight /admin/apply ==="
          curl --silent --show-error --max-time 20 -i -X OPTIONS \
            -H "Origin: https://shubhamturai.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            https://family-tree-community.shubham-turai.workers.dev/admin/apply || true
          echo
          echo "=== Origin POST /admin/apply (unauthenticated) ==="
          curl --silent --show-error --max-time 20 -i -X POST \
            -H "Origin: https://shubhamturai.github.io" \
            -H "Content-Type: application/json" \
            --data "{}" \
            https://family-tree-community.shubham-turai.workers.dev/admin/apply || true
          echo
