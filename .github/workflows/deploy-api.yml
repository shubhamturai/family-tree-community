name: Deploy Family Graph API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "index.html"
      - "admin.html"
      - "data/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        working-directory: backend
        run: npm install --no-save wrangler@4

      - name: Prepare Worker static assets
        working-directory: backend
        run: |
          rm -rf public
          mkdir -p public/data
          cp ../index.html public/index.html
          cp ../admin.html public/admin.html
          cp ../data/* public/data/
          test -s public/index.html
          test -s public/admin.html
          test -s public/data/family.json
          test -s public/data/config.json

      - name: Verify Worker secrets are configured
        working-directory: backend
        run: |
          set -euo pipefail
          SECRETS="$(npx wrangler secret list)"
          echo "$SECRETS"
          echo "$SECRETS" | grep -q "ADMIN_PASSWORD"
          echo "$SECRETS" | grep -q "GITHUB_TOKEN"

      - name: Deploy Worker
        working-directory: backend
        run: npx wrangler deploy

      - name: Apply D1 schema
        working-directory: backend
        run: npx wrangler d1 execute family-tree-community-db --remote --file=schema.sql

      - name: Verify Worker and API
        run: |
          set -euo pipefail

          echo "=== Worker health ==="
          curl --fail-with-body --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors             https://family-tree-community.shubham-turai.workers.dev/health
          echo

          echo "=== Worker-hosted UI ==="
          curl --fail-with-body --silent --show-error --output /tmp/worker-index.html             https://family-tree-community.shubham-turai.workers.dev/
          grep -q "Family Graph" /tmp/worker-index.html

          echo "=== Worker-hosted config ==="
          curl --fail-with-body --silent --show-error             https://family-tree-community.shubham-turai.workers.dev/data/config.json             | grep -q "family-tree-community.shubham-turai.workers.dev"

          echo "=== API unauthenticated admin route ==="
          STATUS="$(curl --silent --show-error --output /tmp/admin-response --write-out "%{http_code}"             -X POST             -H "Content-Type: application/json"             --data "{}"             https://family-tree-community.shubham-turai.workers.dev/admin/apply)"
          test "$STATUS" = "401"
          cat /tmp/admin-response
          echo

          echo "=== API unauthenticated admin check ==="
          STATUS="$(curl --silent --show-error --output /tmp/admin-check-response --write-out "%{http_code}"             https://family-tree-community.shubham-turai.workers.dev/admin/check)"
          test "$STATUS" = "401"
          cat /tmp/admin-check-response
          echo

          echo "=== API D1 request validation ==="
          STATUS="$(curl --silent --show-error --output /tmp/request-response --write-out "%{http_code}"             -X POST             -H "Content-Type: application/json"             --data "{}"             https://family-tree-community.shubham-turai.workers.dev/requests)"
          test "$STATUS" = "400"
          cat /tmp/request-response
          echo

      - name: Verify authenticated community request queue
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          echo "=== Authenticated pending request queue ==="
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $ADMIN_PASSWORD" \
            "https://family-tree-community.shubham-turai.workers.dev/requests?status=pending" \
            -o /tmp/pending-requests.json
          python3 - <<'PY'
          import json
          with open('/tmp/pending-requests.json') as f:
              body=json.load(f)
          requests=body.get('requests')
          if not isinstance(requests,list):
              raise SystemExit('Invalid request queue response')
          print(f"Pending community requests: {len(requests)}")
          for r in requests[:10]:
              print(f"- {r.get('id')} | {r.get('status')} | {r.get('createdAt', r.get('created_at',''))}")
          PY
      - name: Confirm deployed Worker secret names
        working-directory: backend
        run: |
          set -euo pipefail
          SECRETS="$(npx wrangler secret list)"
          echo "$SECRETS"
          echo "$SECRETS" | grep -q "ADMIN_PASSWORD"
          echo "$SECRETS" | grep -q "GITHUB_TOKEN"
