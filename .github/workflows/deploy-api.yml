name: Deploy Family Graph API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        working-directory: backend
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        working-directory: backend
        run: npx wrangler deploy
      - name: Verify Worker endpoint
        run: |
          set -e
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 https://family-tree-community.shubham-turai.workers.dev/health
          echo
          test "$(curl --silent --show-error --output /tmp/post-response --write-out "%{http_code}" -X POST -H "Content-Type: application/json" --data "{}" https://family-tree-community.shubham-turai.workers.dev/requests)" = "400"
          cat /tmp/post-response
          echo "OPTIONS response:"
          curl --silent --show-error -i -X OPTIONS -H "Origin: https://shubhamturai.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://family-tree-community.shubham-turai.workers.dev/requests
