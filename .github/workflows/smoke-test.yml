name: Family Graph smoke test

on:
  workflow_run:
    workflows: ["Deploy Family Graph API","Deploy Family Graph"]
    types: [completed]

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        env:
          WORKER_URL: https://family-tree-community.shubham-turai.workers.dev/
          PAGES_URL: https://shubhamturai.github.io/family-tree-community/
        run: |
          node - <<'NODE'
          const { chromium } = require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[]; const failedRequests=[];
            page.on("pageerror",e=>errors.push(String(e)));
            page.on("requestfailed",r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||"unknown"}));

            await page.goto(process.env.WORKER_URL,{waitUntil:"networkidle",timeout:60000});
            if((await page.title())!=="Family Graph") throw new Error("Wrong Worker page title");
            await page.waitForSelector("#tree",{timeout:10000});
            await page.waitForTimeout(1000);
            if((await page.locator("#tree").innerText()).includes("Unable to load family data")) throw new Error("Family data failed to load");

            const adminCheck=await page.evaluate(async()=>{
              const r=await fetch("/admin/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
              return {status:r.status,text:await r.text()};
            });
            if(adminCheck.status!==401) throw new Error("Same-origin admin route failed: "+JSON.stringify(adminCheck));

            const links=await page.locator("a").evaluateAll(xs=>xs.map(x=>x.href));
            if(links.some(x=>x.includes("/issues/new"))) throw new Error("Public page still contains a GitHub Issues redirect");

            await page.goto(process.env.WORKER_URL+"admin.html",{waitUntil:"networkidle",timeout:60000});
            if((await page.title())!=="Family Graph — Admin Studio") throw new Error("Wrong Worker admin page title");

            await page.goto(process.env.PAGES_URL,{waitUntil:"networkidle",timeout:60000});
            if(!page.url().startsWith(process.env.WORKER_URL)) throw new Error("GitHub Pages did not redirect to Worker app: "+page.url());
            if((await page.title())!=="Family Graph") throw new Error("Redirected app has wrong title");

            if(errors.length) throw new Error("Browser page errors: "+errors.join(" | "));
            await browser.close();
            console.log("Family Graph end-to-end smoke test passed.");
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
